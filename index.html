<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OYEN AI V5 - Kawan Belajar Saya</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7ec;color:#37271e;font-family:system-ui,Arial,sans-serif}.app{max-width:680px;margin:auto;padding:22px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900;color:#f58224}.cat{font-size:90px;text-align:center;margin:10px 0}.intro{text-align:center}h1{margin:0;font-size:30px}p{line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px 0}.tile{border:0;border-radius:25px;padding:24px 8px;min-height:112px;font-weight:800;font-size:19px;cursor:pointer;background:#e1f2ff;color:#28222a}.tile:nth-child(4n+2){background:#dff7e7}.tile:nth-child(4n+3){background:#efe6ff}.tile:nth-child(4n+4){background:#ffe3ee}.emoji{display:block;font-size:35px;margin-bottom:9px}.mic,.next{background:#ff8a2a;color:white;border:0;border-radius:22px;padding:19px;font-size:19px;font-weight:800;cursor:pointer}.mic{width:100%}.status{text-align:center;min-height:30px;font-weight:700;margin:20px 0}.panel{background:white;border-radius:30px;padding:26px 22px;box-shadow:0 4px 18px #573d1610;margin-top:20px}.back{border:0;background:#eee;border-radius:16px;padding:15px 19px;font-size:18px;font-weight:800;cursor:pointer}.panel h2{font-size:29px;margin:26px 0 18px}.choices{display:grid;gap:12px}.choice{width:100%;text-align:left;background:#f6f2ee;border:2px solid transparent;border-radius:20px;padding:18px 20px;font-size:21px;color:#38271f;cursor:pointer}.choice:disabled{opacity:.75}.choice.correct{background:#d8f8df;border-color:#42b56a}.choice.wrong{background:#ffe0e0;border-color:#d96565}.score{font-size:21px;color:#986100;font-weight:800}.question{font-size:34px;font-weight:850;margin:20px 0}.feedback{font-size:21px;font-weight:800;min-height:28px}.next{margin-top:10px}.levels{display:grid;gap:12px}.level{border:0;border-radius:20px;padding:20px;font-size:22px;font-weight:800;text-align:left;cursor:pointer}.easy{background:#ddf8df}.medium{background:#fff0b9}.hard{background:#ffdddd}.small{font-size:15px;font-weight:500;display:block;margin-top:5px}.footer{text-align:center;color:#7a7168;font-size:13px;margin-top:28px}button:focus-visible{outline:3px solid #3177c6;outline-offset:3px}
</style>
</head>
<body><main class="app"><div class="top"><div class="brand">🐾 OYEN AI</div><button class="back" onclick="home()" aria-label="Halaman utama">⌂</button></div><div class="cat" aria-label="Oyen si kucing">🐱</div><div class="intro"><h1>Kawan Belajar Saya</h1><p>Hai! Saya Oyen. Jom belajar bersama!</p></div><div class="grid" id="menu"></div><button class="mic" onclick="listen()">🎤 TEKAN &amp; CAKAP DENGAN OYEN</button><div id="status" class="status" aria-live="polite">Oyen sedia!</div><section id="panel" class="panel" hidden></section><div class="footer">OYEN AI V5 • Aktiviti pendidikan tanpa API berbayar • BORAK ialah respons terbina dalam</div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),panel=$('panel'),status=$('status');
let score=0,attempts=0,level='mudah',current=null,answered=false;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>a.sort(()=>Math.random()-.5);
const menus=[['📚','BELAJAR',learn],['🎮','MAIN',play],['📖','CERITA',stories],['💬','BORAK',chat],['🎨','KREATIF',creative],['🪥','RUTIN',routines],['🔬','EKSPERIMEN',experiments],['🎵','NYANYI',songs],['🚦','SELAMAT',safety],['❤️','AKHLAK',manners],['🏆','CABARAN',challenge]];
$('menu').innerHTML=menus.map((m,i)=>`<button class="tile" onclick="menus[${i}][2]()"><span class="emoji">${m[0]}</span>${m[1]}</button>`).join('');
function say(t){status.textContent=t;if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ms-MY';u.rate=.95;speechSynthesis.speak(u)}}
function openPanel(title,html){panel.hidden=false;panel.innerHTML=`<button class="back" onclick="home()">← Kembali</button><h2>${title}</h2>${html}`;panel.scrollIntoView({behavior:'smooth',block:'start'})}
function home(){panel.hidden=true;status.textContent='Oyen sedia!';window.scrollTo({top:0,behavior:'smooth'})}
function buttons(items){return '<div class="choices">'+items.map(([label,action])=>`<button class="choice" onclick="${action}">${label}</button>`).join('')+'</div>'}
function learn(){openPanel('📚 BELAJAR',buttons([['➕ Matematik','mathLevels()'],['🇬🇧 English','english()'],['🎨 Warna','colors()'],['🔢 Nombor','numbers()'],['🦁 Haiwan','animals()']]))}
function mathLevels(){openPanel('➕ Matematik — Pilih tahap','<div class="levels"><button class="level easy" onclick="startMath(\'mudah\')">🟢 Mudah<span class="small">Tambah dan tolak nombor kecil</span></button><button class="level medium" onclick="startMath(\'sederhana\')">🟡 Sederhana<span class="small">Tambah, tolak dan darab</span></button><button class="level hard" onclick="startMath(\'sukar\')">🔴 Sukar<span class="small">Tambah, tolak, darab dan bahagi</span></button></div>')}
function startMath(l){level=l;score=0;attempts=0;newMath()}
function generateMath(){let a,b,op,answer;const mode=level==='mudah'?rand(0,1):level==='sederhana'?rand(0,2):rand(0,3);
if(level==='mudah'){a=rand(1,10);b=rand(1,10)}else if(level==='sederhana'){a=rand(3,30);b=rand(2,12)}else{a=rand(10,99);b=rand(2,20)}
if(mode===0){op='+';answer=a+b}else if(mode===1){if(a<b)[a,b]=[b,a];op='−';answer=a-b}else if(mode===2){a=rand(level==='sukar'?6:2,level==='sukar'?20:12);b=rand(2,level==='sukar'?15:10);op='×';answer=a*b}else{b=rand(2,12);answer=rand(2,15);a=b*answer;op='÷'}
const options=new Set([answer]);let tries=0;while(options.size<4&&tries++<100){let d=rand(-12,12);if(d===0)continue;let v=answer+d;if(v>=0)options.add(v)}return {q:`${a} ${op} ${b} = ?`,answer,options:shuffle([...options])}}
function newMath(){current=generateMath();answered=false;const label={mudah:'🟢 Mudah',sederhana:'🟡 Sederhana',sukar:'🔴 Sukar'}[level];openPanel('➕ Matematik · '+label,`<button class="back" onclick="mathLevels()">Tukar tahap</button><p class="score" id="score">⭐ Skor ${score} / ${attempts}</p><div class="question">${current.q}</div><div class="choices" id="answers">${current.options.map(n=>`<button class="choice" onclick="answerMath(${n},this)">${n}</button>`).join('')}</div><p class="feedback" id="feedback" aria-live="polite"></p><button id="next" class="next" onclick="newMath()" hidden>Soalan seterusnya →</button>`)}
function answerMath(n,btn){if(answered)return;answered=true;attempts++;const good=n===current.answer;if(good)score++;$('score').textContent=`⭐ Skor ${score} / ${attempts}`;document.querySelectorAll('#answers button').forEach(b=>{b.disabled=true;if(Number(b.textContent)===current.answer)b.classList.add('correct')});if(!good)btn.classList.add('wrong');$('feedback').textContent=good?'🎉 Betul! Hebat!':`💡 Jawapan yang betul: ${current.answer}`;$('next').hidden=false;say(good?'Bagus! Jawapan betul.':'Cuba lagi pada soalan seterusnya.')}
function simpleQuiz(title,q,arr,correct,next){current={answer:correct};answered=false;openPanel(title,`<div class="question">${q}</div><div class="choices" id="answers">${arr.map(x=>`<button class="choice" onclick="answerSimple(this)">${x}</button>`).join('')}</div><p id="feedback" class="feedback"></p><button class="next" id="next" hidden onclick="${next}()">Soalan seterusnya →</button>`)}
function answerSimple(btn){if(answered)return;answered=true;const good=btn.textContent===current.answer;document.querySelectorAll('#answers button').forEach(b=>{b.disabled=true;if(b.textContent===current.answer)b.classList.add('correct')});if(!good)btn.classList.add('wrong');$('feedback').textContent=good?'🎉 Betul! Hebat!':'💡 Jawapan: '+current.answer;$('next').hidden=false;say(good?'Bagus! Jawapan betul.':'Cuba lagi!')}
const animalsData=[['🐰','Arnab'],['🐯','Harimau'],['🐘','Gajah'],['🐱','Kucing'],['🐟','Ikan']];
function animals(){let d=animalsData[rand(0,4)];simpleQuiz('🦁 Haiwan','Haiwan apakah ini? '+d[0],shuffle(animalsData.map(x=>x[1])).slice(0,4).includes(d[1])?shuffle([d[1],...shuffle(animalsData.filter(x=>x[1]!==d[1])).slice(0,3).map(x=>x[1])]):[d[1],'Ikan','Kucing','Gajah'],d[1],'animals')}
const colorData=[['🔴','Merah'],['🔵','Biru'],['🟢','Hijau'],['🟡','Kuning']];
function colors(){let d=colorData[rand(0,3)];simpleQuiz('🎨 Warna','Apakah warna ini? '+d[0],shuffle(colorData.map(x=>x[1])),d[1],'colors')}
function numbers(){let n=rand(1,8);simpleQuiz('🔢 Nombor','Kira bintang: '+'⭐'.repeat(n),shuffle([n,n+1,n+2,Math.max(0,n-1)]).map(String),String(n),'numbers')}
const words=[['CAT','Kucing'],['BOOK','Buku'],['APPLE','Epal'],['SUN','Matahari']];
function english(){let d=words[rand(0,3)];simpleQuiz('🇬🇧 English','Apakah maksud '+d[0]+'?',shuffle(words.map(x=>x[1])),d[1],'english')}
function pick(title,items){openPanel(title,buttons(items.map((s,i)=>[s[0],`showItem('${title.replace(/'/g,'')} ',${i})`])));window.activeItems=items;window.activeTitle=title}
function showItem(t,i){const d=window.activeItems[i];openPanel(window.activeTitle,`<p style="font-size:23px">${d[1]}</p><button class="next" onclick="${window.activeBack||'home'}()">Pilih lagi →</button>`);say(d[1])}
function play(){openPanel('🎮 MAIN',buttons([['🧩 Teka-teki','riddle()'],['⚡ Kira pantas','mathLevels()'],['✅ Benar / Salah','trueFalse()'],['🧠 Ingatan','memory()']]))}
const riddles=[['Saya ada belalai. Siapakah saya?','Gajah',['Gajah','Kucing','Arnab']],['Saya ada telinga panjang. Siapa saya?','Arnab',['Arnab','Ikan','Gajah']]];
function riddle(){let d=riddles[rand(0,riddles.length-1)];simpleQuiz('🧩 Teka-teki',d[0],shuffle([...d[2]]),d[1],'riddle')}
const facts=[['Ikan hidup di air.','Benar'],['Kucing ada enam kaki.','Salah'],['Matahari memberi cahaya.','Benar']];
function trueFalse(){let d=facts[rand(0,facts.length-1)];simpleQuiz('✅ Benar / Salah',d[0],['Benar','Salah'],d[1],'trueFalse')}
function memory(){simpleQuiz('🧠 Ingatan','Ingat susunan: 🍎 🐰 🚗. Apakah objek kedua?',['🍎','🐰','🚗'],'🐰','memory')}
const tales=[['Oyen dan Burung Kecil','Oyen melihat seekor burung yang kehausan. Dia meletakkan semangkuk air di tempat teduh. Burung itu minum dengan gembira. Pengajaran: Kita perlu menyayangi haiwan.'],['Oyen Berkongsi','Oyen ada dua biji epal. Dia memberikan sebiji kepada Miki. Mereka makan bersama. Pengajaran: Berkongsi membuat kita gembira.']];
function stories(){pick('📖 CERITA',tales);window.activeBack='stories'}
function chat(){openPanel('💬 BORAK','<p>Taip: hai, saya gembira, saya sedih, atau teka-teki.</p><input id="message" style="width:100%;font-size:20px;padding:16px;border-radius:14px;border:1px solid #aaa" placeholder="Taip mesej di sini"><button class="next" onclick="reply()">Hantar</button><p id="reply" aria-live="polite"></p>')}
function reply(){let t=$('message').value.trim().toLowerCase();let r=!t?'Taip sesuatu dahulu ya.':t.includes('sedih')?'Oyen ada di sini. Mahu bercerita dengan ibu atau ayah?':t.includes('gembira')?'Wah! Oyen pun tumpang gembira!':t.includes('teka')?'Teka-teki: Haiwan apa ada belalai?':t.includes('hai')?'Hai kawan! Jom belajar bersama Oyen!':'Oyen dengar! Jom cuba BELAJAR atau MAIN pula.';$('reply').textContent=r;say(r)}
function creative(){openPanel('🎨 KREATIF','<p>Gunakan jari untuk melukis!</p><canvas id="draw" width="300" height="260" style="width:100%;background:#fff;border:2px solid #ddd;touch-action:none;border-radius:16px"></canvas><button class="next" onclick="creative()">Padam lukisan</button>');let c=$('draw'),ctx=c.getContext('2d'),drawing=false;function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(!drawing)return;ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#ff8a2a';ctx.lineTo(...pos(e));ctx.stroke()};c.onpointerup=()=>drawing=false}
const routineData=[['🪥 Gosok gigi','Berus gigi perlahan-lahan selama dua minit dengan bantuan ibu atau ayah.'],['🧼 Basuh tangan','Gunakan sabun dan air bersih sebelum makan.']];
function routines(){pick('🪥 RUTIN',routineData);window.activeBack='routines'}
const experimentData=[['🌱 Benih bercambah','Letakkan beberapa biji kacang hijau di atas kapas lembap dalam bekas. Periksa setiap hari bersama orang dewasa.'],['🧊 Ais mencair','Letakkan ais di dalam bekas dan lihat perubahan apabila ia mencair.']];
function experiments(){pick('🔬 EKSPERIMEN',experimentData);window.activeBack='experiments'}
const songData=[['🎵 Lagu Nombor','Satu, dua, tiga, mari kira bersama! Empat, lima, enam, Oyen gembira!'],['🎶 Lagu Warna','Merah, biru, hijau, kuning. Warna cantik di sekeliling!']];
function songs(){pick('🎵 NYANYI',songData);window.activeBack='songs'}
const safeData=[['🚦 Melintas jalan','Lihat kiri dan kanan bersama orang dewasa sebelum melintas.'],['🏠 Di rumah','Jangan bermain dengan soket elektrik atau benda tajam.']];
function safety(){pick('🚦 SELAMAT',safeData);window.activeBack='safety'}
const mannerData=[['❤️ Ucap terima kasih','Katakan terima kasih apabila seseorang membantu kita.'],['🤝 Minta maaf','Jika tersilap, minta maaf dan cuba perbaiki kesilapan.']];
function manners(){pick('❤️ AKHLAK',mannerData);window.activeBack='manners'}
function challenge(){openPanel('🏆 CABARAN','<p>Jom uji kemahiran Matematik kamu!</p><button class="next" onclick="mathLevels()">Mula cabaran →</button>')}
function listen(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status.textContent='Pelayar ini tidak menyokong pengecaman suara. Gunakan butang atau BORAK.';return}let r=new R();r.lang='ms-MY';r.onresult=e=>{let t=e.results[0][0].transcript.toLowerCase();status.textContent='Oyen dengar: '+t;if(t.includes('matematik'))mathLevels();else if(t.includes('belajar'))learn();else if(t.includes('main'))play();else if(t.includes('cerita'))stories();else if(t.includes('borak'))chat();else say('Oyen dengar! Pilih aktiviti yang kamu suka.')};r.onerror=()=>status.textContent='Oyen tak dengar dengan jelas. Cuba lagi ya.';try{r.start();status.textContent='Oyen sedang mendengar...'}catch(e){status.textContent='Mikrofon belum tersedia.'}}
</script></body></html>
