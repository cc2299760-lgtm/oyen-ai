if(mode==='emoji'){let item=pick(emoji);correct=item[1];t='Apakah maksud emoji ini?';visual=esc(item[0]);opts=choices(correct,pool(emoji));}
if(mode==='memory'){let item=pick(animals);correct=item[1];t='Ingat haiwan ini selama 4 saat!';visual=esc(item[0]);opts=choices(correct,pool(animals));}
q={correct,opts,t};const title=games.find(x=>x[0]===mode)[2];$('screen').innerHTML=`<div class="card"><div class="nav"><button class="back" onclick="home()">← Menu</button><span class="score">⭐ ${score} / ${count-1}</span></div><h2 style="text-align:center">${games.find(x=>x[0]===mode)[1]} ${title}</h2><div class="question" id="question">${esc(t)}</div><div class="visual" id="visual">${visual}</div><div class="toolbar"><button class="voice" onclick="repeatQuestion()">🔊 Dengar soalan</button><button class="mic" onclick="listen()">🎤 Jawab suara</button></div><div class="answers" id="answers">${mode==='memory'?'':opts.map((x,i)=>`<button class="option" data-idx="${i}" onclick="answer(${i})">${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next hidden" id="next" onclick="next()">Soalan seterusnya ➜</button></div>`;
setStatus('Permainan '+title+' • Soalan '+count);say(t);if(mode==='memory'){let thisCount=count;setTimeout(()=>{if(mode!=='memory'||count!==thisCount||locked)return;$('question').textContent='Haiwan apakah yang kamu lihat tadi?';$('visual').textContent='❓';$('answers').innerHTML=q.opts.map((x,i)=>`<button class="option" data-idx="${i}" onclick="answer(${i})">${esc(x)}</button>`).join('');memorized=true;say('Haiwan apakah yang kamu lihat tadi?')},4000)}}
function repeatQuestion(){say(mode==='memory'&&memorized?'Haiwan apakah yang kamu lihat tadi?':q.t)}
function answer(i){if(locked||!q||mode==='memory'&&!memorized)return;locked=true;const val=q.opts[i],ok=val===q.correct;if(ok)score++;document.querySelectorAll('.option').forEach(b=>{const v=q.opts[Number(b.dataset.idx)];b.disabled=true;if(v===q.correct)b.classList.add('correct');else if(v===val)b.classList.add('wrong')});const msg=ok?'🎉 Betul! Hebat!':'💡 Cuba lagi pada soalan seterusnya. Jawapan: '+q.correct;$('feedback').textContent=msg;$('next').classList.remove('hidden');document.querySelector('.score').textContent=`⭐ ${score} / ${count}`;say(ok?'Betul! Hebat!':`Bagus mencuba. Jawapan yang betul ialah ${q.correct}`)}
function listen(){if(locked)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setStatus('Pengecaman suara tidak disokong. Tekan pilihan jawapan.');say('Sila tekan jawapan di skrin.');return}if(mode==='memory'&&!memorized){setStatus('Tunggu gambar disembunyikan dahulu.');return}try{if(rec)rec.abort();rec=new SR();rec.lang='ms-MY';rec.interimResults=false;rec.maxAlternatives=3;rec.onstart=()=>setStatus('🎤 Oyen sedang mendengar...');rec.onerror=e=>setStatus('Mikrofon: '+e.error+'. Boleh jawab dengan menekan butang.');rec.onresult=e=>{let heard=Array.from(e.results[0]).map(x=>x.transcript.toLowerCase().trim());setStatus('Oyen dengar: '+heard[0]);let i=q.opts.findIndex(x=>heard.some(h=>h.includes(x.toLowerCase())));if(i<0&&mode==='math'){let nums={'kosong':0,'satu':1,'dua':2,'tiga':3,'empat':4,'lima':5,'enam':6,'tujuh':7,'lapan':8,'sembilan':9,'sepuluh':10,'sebelas':11,'dua belas':12,'tiga belas':13,'empat belas':14,'lima belas':15,'enam belas':16,'tujuh belas':17,'lapan belas':18,'sembilan belas':19,'dua puluh':20};i=q.opts.findIndex(x=>heard.some(h=>h===x||nums[h]===Number(x)))}if(i>=0)answer(i);else{setStatus('Oyen dengar "'+heard[0]+'". Cuba sebut jawapan yang tertera atau tekan butang.');say('Maaf, Oyen kurang jelas. Cuba lagi.')}};rec.start()}catch(e){setStatus('Tidak dapat membuka mikrofon. Gunakan butang jawapan.')}}
home();</script></body></html>
