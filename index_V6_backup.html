<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OYEN AI V6 – Kawan Belajar Saya</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7ec;color:#38271f;font-family:system-ui,Arial,sans-serif}.app{max-width:680px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 18px}.brand{font-weight:900;font-size:24px;color:#f58722}.card{background:#fff;border-radius:32px;padding:25px 20px;min-height:65vh;box-shadow:0 10px 35px #b27b3c12}.hero{text-align:center}.cat{font-size:105px;filter:drop-shadow(0 9px 4px #0001)}h1{font-size:31px;margin:8px 0}h2{font-size:27px}p{line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.choice,.next,.back{border:0;cursor:pointer;font:inherit}.tile{padding:23px 8px;border-radius:22px;font-size:20px;font-weight:800}.tile:nth-child(4n+1){background:#d9eeff}.tile:nth-child(4n+2){background:#e0f7e5}.tile:nth-child(4n+3){background:#eee6ff}.tile:nth-child(4n){background:#ffe6ed}.back{background:#eee;border-radius:18px;padding:13px 18px;font-weight:700}.choice{width:100%;text-align:left;background:#f7f4f1;padding:18px 20px;border-radius:20px;margin:7px 0;font-size:23px;color:#594b44;border:2px solid transparent}.choice.correct{background:#e1f8e8;border-color:#6ac58b}.choice.wrong{background:#ffe6e6;border-color:#db8d8d}.choice:disabled{opacity:1}.next{background:#ff8b2a;color:white;border-radius:20px;padding:17px 23px;font-size:21px;font-weight:800;margin-top:18px}.question{font-size:27px;font-weight:800;margin:25px 0 16px}.art{display:block;font-size:82px;line-height:1.3;text-align:center;filter:drop-shadow(0 9px 5px #0002)}.stars{font-size:36px;letter-spacing:2px;overflow-wrap:anywhere}.feedback{font-size:21px;font-weight:800;margin-top:18px}.muted{color:#81766e;font-size:14px;text-align:center;margin:18px}.stat{background:#fff2df;padding:12px;border-radius:15px;margin-top:15px;font-weight:700}.pill{background:#fff3df;padding:8px 14px;border-radius:20px}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:16px}.story{background:#fff6e8;border-radius:18px;padding:17px;line-height:1.7;font-size:19px}input{font:inherit;padding:15px;border:2px solid #eee;border-radius:15px;width:100%}@media(max-width:390px){.app{padding:10px}.card{padding:19px 15px}.question{font-size:24px}.choice{font-size:20px}}
</style></head><body><main class="app"><div class="top"><div class="brand">🐾 OYEN AI <span class="small">V6</span></div><span class="pill">🌟 Belajar Seronok</span></div><section id="panel" class="card"></section><div class="muted">OYEN AI V6 • Aktiviti pendidikan • Tiada API berbayar • BORAK menggunakan respons terbina dalam</div></main>
<script>
'use strict';
const panel=document.getElementById('panel');let current=null,locked=false,score=0,total=0,level='mudah',category='',lastQuestion='';
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const animals=[['Kucing','🐱'],['Arnab','🐰'],['Gajah','🐘'],['Ikan','🐟'],['Singa','🦁'],['Panda','🐼'],['Anjing','🐶'],['Monyet','🐵'],['Burung','🐦'],['Harimau','🐯'],['Katak','🐸'],['Kura-kura','🐢']];
const colors=[['Merah','🔴'],['Biru','🔵'],['Hijau','🟢'],['Kuning','🟡'],['Ungu','🟣'],['Oren','🟠']];
const words=[['CAT','Kucing'],['BOOK','Buku'],['APPLE','Epal'],['SUN','Matahari'],['FISH','Ikan'],['BIRD','Burung'],['DOG','Anjing'],['STAR','Bintang']];
const btn=(label,fn,cls='choice')=>`<button class="${cls}" onclick="${fn}">${label}</button>`;
function speak(t){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ms-MY';u.rate=.85;speechSynthesis.speak(u)}}
function screen(title,html){panel.innerHTML=`${btn('← Kembali','back()','back')}<h2>${title}</h2>${html}`;window.scrollTo({top:0,behavior:'smooth'})}
let back=home;
function home(){back=home;panel.innerHTML=`<div class="hero"><div class="cat">🐱</div><h1>Kawan Belajar Saya</h1><p>Hai! Saya Oyen. Jom belajar bersama!</p></div><div class="grid">${btn('📚 BELAJAR','learn()','tile')}${btn('🎮 MAIN','play()','tile')}${btn('📖 CERITA','stories()','tile')}${btn('💬 BORAK','chat()','tile')}</div><p class="muted">Pilih aktiviti untuk bermula 🐾</p>`}
function learn(){back=home;screen('📚 BELAJAR',`<div class="grid">${btn('➕ Matematik','mathLevels()','tile')}${btn('🇬🇧 English','startQuiz("english")','tile')}${btn('🎨 Warna','startQuiz("colors")','tile')}${btn('🔢 Nombor','startQuiz("numbers")','tile')}${btn('🦁 Haiwan','startQuiz("animals")','tile')}</div>`)}
function mathLevels(){back=learn;screen('➕ Matematik – Pilih Tahap',`<div class="grid">${btn('🟢 Mudah','startMath("mudah")','tile')}${btn('🟡 Sederhana','startMath("sederhana")','tile')}${btn('🔴 Sukar','startMath("sukar")','tile')}</div>`)}
function startMath(l){level=l;startQuiz('math')}
function startQuiz(c){category=c;score=0;total=0;back=c==='math'?mathLevels:learn;nextQuestion()}
function optionsFor(correct,pool){let others=shuffle([...new Set(pool.filter(x=>String(x)!==String(correct)))]).slice(0,3);return shuffle([correct,...others])}
function nextQuestion(){locked=false;let q='',art='',correct,options,title='';
if(category==='animals'){title='🦁 Haiwan';let a=animals[rand(0,animals.length-1)];correct=a[0];q='Haiwan apakah ini?';art=`<span class="art">${a[1]}</span>`;options=optionsFor(correct,animals.map(x=>x[0]))}
if(category==='colors'){title='🎨 Warna';let a=colors[rand(0,colors.length-1)];correct=a[0];q='Apakah warna ini?';art=`<span class="art">${a[1]}</span>`;options=optionsFor(correct,colors.map(x=>x[0]))}
if(category==='numbers'){title='🔢 Nombor';correct=rand(1,10);q='Kira bintang:';art=`<div class="stars">${'⭐'.repeat(correct)}</div>`;options=optionsFor(correct,Array.from({length:11},(_,i)=>i));while(options.length<4)options=shuffle([...options,rand(0,10)])}
if(category==='english'){title='🇬🇧 English';let a=words[rand(0,words.length-1)];correct=a[1];q=`Apakah maksud “${a[0]}”?`;options=optionsFor(correct,words.map(x=>x[1]))}
if(category==='math'){title='➕ Matematik';let a,b,sign='+',ans;if(level==='mudah'){a=rand(0,10);b=rand(0,10)}else if(level==='sederhana'){a=rand(3,25);b=rand(1,20);sign=Math.random()<.5?'+':'−';if(sign==='−'&&b>a)[a,b]=[b,a]}else{a=rand(2,12);b=rand(2,12);sign=Math.random()<.5?'×':'+'}ans=sign==='+'?a+b:sign==='−'?a-b:a*b;correct=ans;q=`Berapakah ${a} ${sign} ${b} ?`;let pool=new Set([ans]);let tries=0;while(pool.size<4&&tries++<50){let n=Math.max(0,ans+rand(-12,12));pool.add(n)}options=shuffle([...pool].slice(0,4))}
current={correct,options};lastQuestion=q;screen(title,`<div class="stat">Soalan ${total+1} · Betul ${score}/${total}</div><div class="question">${q}</div>${art}<div id="answers">${options.map((o,i)=>btn(o,`answer(${i})`)).join('')}</div><div id="feedback" aria-live="polite"></div>`)}
function answer(i){if(locked)return;locked=true;total++;let chosen=current.options[i],good=String(chosen)===String(current.correct);if(good)score++;let nodes=[...document.querySelectorAll('#answers button')];nodes.forEach((node,j)=>{node.disabled=true;if(String(current.options[j])===String(current.correct))node.classList.add('correct');else if(j===i)node.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback">${good?'🎉 Betul! Hebat!':'💡 Jawapan: '+current.correct}</div><div class="stat">Markah: ${score} / ${total}</div>${btn('Soalan seterusnya →','nextQuestion()','next')}`;speak(good?'Betul! Hebat!':'Jawapan yang betul ialah '+current.correct)}
function play(){back=home;screen('🎮 MAIN',`<div class="grid">${btn('⭐ Kira Pantas','startMath("mudah")','tile')}${btn('🐾 Teka Haiwan','startQuiz("animals")','tile')}${btn('🎨 Teka Warna','startQuiz("colors")','tile')}${btn('🔢 Kira Bintang','startQuiz("numbers")','tile')}</div>`)}
const tales=[['Oyen dan Burung Kecil','Oyen ternampak seekor burung yang kehausan. Dia meletakkan semangkuk air di tempat teduh. Burung itu minum dan berkicau riang. Oyen belajar bahawa kebaikan kecil boleh membawa kegembiraan besar.'],['Oyen Berkongsi Mainan','Oyen ada dua bola. Dia nampak Miki tiada mainan. Oyen berkongsi sebiji bola. Mereka bermain bersama dengan gembira. Berkongsi membuat persahabatan lebih indah.'],['Oyen Belajar Sabar','Oyen menanam biji benih. Dia mahu bunga tumbuh segera, tetapi bunga memerlukan masa. Oyen menyiramnya setiap hari. Akhirnya bunga mekar. Oyen belajar supaya bersabar dan rajin.']];
function stories(){back=home;screen('📖 CERITA',`<div class="grid">${tales.map((t,i)=>btn('📖 '+t[0],`showStory(${i})`,'tile')).join('')}</div>`)}
function showStory(i){back=stories;screen('📖 '+tales[i][0],`<div class="art">🐱📖</div><div class="story">${tales[i][1]}</div>${btn('🔊 Dengar cerita',`speak(tales[${i}][1])`,'next')}`)}
function chat(){back=home;screen('💬 BORAK',`<div class="art">🐱</div><p>Hai! Oyen boleh berbual tentang perasaan dan belajar perkara baik. Pilih satu:</p><div class="grid">${btn('😊 Saya gembira','reply(0)','tile')}${btn('😢 Saya sedih','reply(1)','tile')}${btn('🌟 Beri semangat','reply(2)','tile')}${btn('🐾 Teka-teki','reply(3)','tile')}</div><div id="chatReply" class="story" style="margin-top:20px">Oyen sedia mendengar! 🐾</div>`)}
function reply(i){let r=['Seronoknya! Apa yang membuat kamu gembira hari ini?','Oyen ada di sini. Kamu boleh bercakap dengan ibu, ayah atau orang dewasa yang dipercayai.','Kamu hebat kerana terus mencuba! Belajar sedikit demi sedikit setiap hari.','Teka-teki: Saya ada empat kaki, telinga panjang dan suka lobak. Siapakah saya? 🐰'];document.getElementById('chatReply').textContent=r[i];speak(r[i])}
home();
</script></body></html>
